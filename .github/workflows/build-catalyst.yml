name: Build Catalyst Web Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Create Catalyst static build configuration
        run: |
          cat > vite.config.catalyst.ts <<'EOF'
          import { defineConfig } from "@lovable.dev/vite-tanstack-config";

          export default defineConfig({
            nitro: false,
            tanstackStart: {
              server: { entry: "server" },
              prerender: {
                enabled: true,
                crawlLinks: true
              },
              pages: [
                { path: "/" }
              ]
            },
            vite: {
              base: "./"
            }
          });
          EOF

      - name: Build static web client
        run: npx vite build --config vite.config.catalyst.ts

      - name: Find built client
        run: |
          echo "Searching for index.html..."
          find dist -type f -name "index.html" -print || true

      - name: Prepare Catalyst client package
        run: |
          mkdir -p catalyst-client

          if [ -f "dist/client/index.html" ]; then
            cp -r dist/client/. catalyst-client/
          elif [ -f "dist/index.html" ]; then
            cp -r dist/. catalyst-client/
          else
            echo "ERROR: Could not find built index.html"
            find dist -maxdepth 4 -type f | head -100
            exit 1
          fi

          cat > catalyst-client/client-package.json <<'EOF'
          {
            "name": "PropertyManagementUI",
            "version": "1.0.0",
            "description": "Property Management frontend connected to Zoho Catalyst",
            "homepage": "index.html"
          }
          EOF

      - name: Verify Catalyst package
        run: |
          echo "Catalyst package contents:"
          find catalyst-client -maxdepth 2 -type f | sort

          test -f catalyst-client/index.html
          test -f catalyst-client/client-package.json

      - name: Create deployment ZIP
        run: |
          cd catalyst-client
          zip -r ../property-management-catalyst-ui.zip .

      - name: Upload Catalyst package
        uses: actions/upload-artifact@v4
        with:
          name: property-management-catalyst-ui
          path: property-management-catalyst-ui.zip
